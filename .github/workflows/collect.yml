name: 표지·BGG 자동 수집
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - run: python scripts/collect_covers.py
        env:
          API_URL: https://script.google.com/macros/s/AKfycbzgjfbQGRrwI9lLVhgDxM8bgfXbm4YePkPsE0A2JoMU3E9dbE2-tCOUIMs6zPQgxS9P/exec?format=json
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
      - name: 새 표지 커밋
        run: |
          git config user.name "cover-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers
          git diff --cached --quiet || (git commit -m "표지 자동 수집" && git push)
